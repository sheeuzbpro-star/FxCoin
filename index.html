<!DOCTYPE html>
<html>
<head>
    <title>EduConnect | Premium</title>
    <style>
        :root { --bg: #0f0c29; --glass: rgba(255, 255, 255, 0.1); --neon: #00d2ff; }
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            color: white; font-family: 'Poppins', sans-serif; margin: 0; height: 100vh; overflow: hidden;
        }
        .container { display: flex; height: 100vh; backdrop-filter: blur(10px); }
        
        /* Sidebar (Kontaktlar) */
        .sidebar { width: 260px; background: var(--glass); border-right: 1px solid rgba(255,255,255,0.1); padding: 20px; }
        .contact-item { padding: 10px; margin: 5px 0; background: rgba(0,0,0,0.2); border-radius: 8px; cursor: pointer; }
        
        /* Chat Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        #msg-box { flex: 1; overflow-y: auto; background: var(--glass); border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        
        /* Video Box */
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        video { width: 100%; border-radius: 10px; background: #000; border: 2px solid var(--neon); }

        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 30px; border: none; background: var(--glass); color: white; outline: none; }
        button { padding: 0 25px; border-radius: 30px; background: var(--neon); border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2 style="color: var(--neon)">EduConnect</h2>
            <div class="contact-item">👥 Guruh: Matematika</div>
            <div class="contact-item">👥 Guruh: Dasturlash</div>
            <hr>
            <h4>Kontaktlar</h4>
            <div class="contact-item">👤 Aleksandr (Siz)</div>
        </div>
        
        <div class="main-chat">
            <div class="video-grid">
                <video id="localVideo" autoplay muted></video>
                <video id="remoteVideo" autoplay></video>
            </div>
            
            <div id="msg-box"></div>
            
            <div class="input-area">
                <input id="m" placeholder="Xabaringizni yozing... (Bot uchun /bot deng)">
                <button onclick="send()">Yuborish</button>
                <button style="background: #ff4b2b;" onclick="startVideo()">📹</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function send() {
            const m = document.getElementById('m');
            socket.emit('send_msg', m.value);
            m.value = '';
        }

        async function startVideo() {
            const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('localVideo').srcObject = stream;
            alert("Video chaqiruv yoqildi! PeerJS orqali boshqalarga ulanishingiz mumkin.");
        }

        socket.on('render_msg', d => {
            const div = document.createElement('div');
            div.innerHTML = `<p><b>${d.user}:</b> ${d.text}</p>`;
            document.getElementById('msg-box').appendChild(div);
        });
    </script>
</body>
</html>
